<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101522"><link rel="manifest" href="manifest.json"><title>Mein Dashboard</title><style>
:root{font-family:system-ui;color:#eef2f7;background:#0d1119}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0d1119,#151c2b);min-height:100vh}main{max-width:760px;margin:auto;padding:18px 14px 32px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}h1{font-size:25px;margin:0}.sub,.small,.status{color:#9aa6b7;font-size:12px}.btn{border:1px solid #344052;background:#1b2433;color:#fff;border-radius:12px;padding:10px 12px}.title{font-size:14px;font-weight:700;margin:18px 0 9px 3px}.grid3,.grid2{display:grid;gap:10px}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.card{background:#171e2b;border:1px solid #2b3545;border-radius:18px;padding:15px;box-shadow:0 8px 24px #0003}.label{color:#9aa6b7;font-size:12px}.value{font-size:28px;font-weight:800;margin:5px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.match{padding:12px 0;border-top:1px solid #2b3545}.match:first-child{border-top:0}.center{text-align:center}.green{color:#63d391}.red{color:#ff7777}@media(max-width:560px){.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr 1fr}}</style></head><body><main>
<div class="top"><div><h1>Mein Dashboard</h1><div class="sub">Wetter · Märkte · Fußball</div></div><button class="btn" id="refresh">↻ Aktualisieren</button></div>
<div class="title">🌤 Wetter & Regen</div><div id="weather" class="grid3"><div class="card">Lade …</div></div>
<div class="title">💱 Währung</div><div class="card"><div class="label">EUR → TRY</div><div id="fx" class="value">Lade …</div><div class="small">Referenzkurs</div></div>
<div class="title">📈 Börsenindizes</div><div class="grid2">
<div class="card"><div class="row"><b>DAX</b><span>🇩🇪</span></div><div id="dax" class="value">—</div><div id="daxc" class="small"></div></div>
<div class="card"><div class="row"><b>BIST 100</b><span>🇹🇷</span></div><div id="bist" class="value">—</div><div id="bistc" class="small"></div></div>
<div class="card"><div class="row"><b>Dow Jones</b><span>🇺🇸</span></div><div id="dow" class="value">—</div><div id="dowc" class="small"></div></div>
<div class="card"><div class="row"><b>S&amp;P 500</b><span>🇺🇸</span></div><div id="sp" class="value">—</div><div id="spc" class="small"></div></div>
<div class="card"><div class="row"><b>Nasdaq</b><span>🇺🇸</span></div><div id="nasdaq" class="value">—</div><div id="nasdaqc" class="small"></div></div></div>
<div class="title">🪙 Edelmetalle</div><div class="grid2"><div class="card"><div class="label">🥇 Gold</div><div id="gold" class="value">—</div><div class="small">USD / Feinunze</div></div><div class="card"><div class="label">🥈 Silber</div><div id="silver" class="value">—</div><div class="small">USD / Feinunze</div></div></div>
<div class="title">⚽ Nächste Länderspiele</div><div class="card" id="football">Lade …</div><div id="status" class="status" style="text-align:center;margin-top:16px">Wird aktualisiert …</div>
</main><script>
const places=[["Akyaka",37.056,28.326],["Çamlı",36.985,28.274],["Alanya",36.543,31.999]];
const fmt=x=>Number.isFinite(+x)?(+x).toLocaleString("de-DE",{maximumFractionDigits:2}):"—";
async function j(u){let r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error(r.status);return r.json()}
async function weather(){let a=await Promise.all(places.map(async p=>[p[0],await j(`https://api.open-meteo.com/v1/forecast?latitude=${p[1]}&longitude=${p[2]}&current=temperature_2m,apparent_temperature,wind_speed_10m&hourly=precipitation_probability,precipitation&forecast_days=2&timezone=auto`)]));document.querySelector("#weather").innerHTML=a.map(([name,d])=>{let i=-1;for(let k=0;k<d.hourly.time.length;k++)if(new Date(d.hourly.time[k])>new Date()&&d.hourly.precipitation_probability[k]>=40){i=k;break}let rain=i<0?"🌤 Kein Regen ≥40% erwartet":`🌧 Regen ab ${new Date(d.hourly.time[i]).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})} · ${d.hourly.precipitation_probability[i]}% · ${fmt(d.hourly.precipitation[i])} mm`;return `<div class="card"><div class="label">${name}</div><div class="value">${fmt(d.current.temperature_2m)}°</div><div>🌡 Gefühlt ${fmt(d.current.apparent_temperature)}°</div><div class="small">${rain}</div><div class="small">Wind ${fmt(d.current.wind_speed_10m)} km/h</div></div>`}).join("")}
async function fx(){let d=await j("https://api.frankfurter.dev/v2/rate/eur/try");document.querySelector("#fx").textContent=fmt(d.rate)+" ₺"}
async function metals(){let [a,b]=await Promise.all([j("https://api.gold-api.com/price/XAU"),j("https://api.gold-api.com/price/XAG")]);document.querySelector("#gold").textContent="$"+fmt(a.price??a);document.querySelector("#silver").textContent="$"+fmt(b.price??b)}
async function stock(id,s){try{let d=await j("https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(s)+"?range=1d&interval=5m"),m=d.chart.result[0].meta,q=m.regularMarketPrice,p=m.previousClose,c=(q-p)/p*100;document.querySelector("#"+id).textContent=fmt(q);let e=document.querySelector("#"+id+"c");e.textContent=(c>=0?"▲ ":"▼ ")+fmt(Math.abs(c))+"%";e.className="small "+(c>=0?"green":"red")}catch{}}
async function stocks(){await Promise.all([stock("dax","^GDAXI"),stock("bist","XU100.IS"),stock("dow","^DJI"),stock("sp","^GSPC"),stock("nasdaq","^IXIC")])}
async function football(){try{let d=await j("https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.nations/scoreboard?limit=100"),e=(d.events||[]).filter(x=>/germany|türkiye|turkey/i.test(x.name||"")).slice(0,8);document.querySelector("#football").innerHTML=e.length?e.map(x=>{let c=x.competitions[0].competitors;return `<div class="match"><div class="row"><b>${c[0].team.displayName}</b><span>⚽</span><b>${c[1].team.displayName}</b></div><div class="small center">${new Date(x.date).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div></div>`}).join(""):"<div class='small'>Keine passenden kommenden Länderspiele gefunden.</div>"}catch{document.querySelector("#football").innerHTML="<div class='small'>Fußball-Daten momentan nicht verfügbar.</div>"}}
async function load(){document.querySelector("#status").textContent="Aktualisiere …";await Promise.allSettled([weather(),fx(),metals(),stocks(),football()]);document.querySelector("#status").textContent="Zuletzt aktualisiert: "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}document.querySelector("#refresh").onclick=load;load();setInterval(load,900000);if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
