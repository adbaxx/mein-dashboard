name: Update BIST 100
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 7-15 * * 1-5"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch BIST 100
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, datetime
          symbol="XU100.IS"
          url="https://query1.finance.yahoo.com/v8/finance/chart/"+urllib.parse.quote(symbol)+"?range=1d&interval=5m"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          data=json.load(urllib.request.urlopen(req,timeout=20))
          r=data["chart"]["result"][0]
          m=r["meta"]
          value=m.get("regularMarketPrice")
          prev=m.get("chartPreviousClose") or m.get("previousClose")
          change=((value-prev)/prev*100) if value is not None and prev else None
          out={"value":value,"changePercent":change,"marketState":m.get("marketState","unknown"),"updatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat()}
          with open("data/bist.json","w") as f: json.dump(out,f)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bist.json
          git diff --cached --quiet || git commit -m "Update BIST 100"
          git push
